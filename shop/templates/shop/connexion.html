{% extends 'shop/base.html' %}

{% block title %}YaTout — Connexion Vendeur{% endblock %}

{% block content %}
<!-- Style premium et compact pour la page de connexion -->
<style>
    /* 🟢 CONTENEUR GLOBAL CENTRÉ */
    .login-wrapper {
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        min-height: 70vh !important;
        padding: 40px 20px !important;
        background-color: #f1f5f9 !important; /* Gris clair pro identique à l'inscription */
        font-family: system-ui, -apple-system, sans-serif !important;
        width: 100% !important;
        box-sizing: border-box !important;
    }

    /* 🟢 CARTE DE CONNEXION COMPACTE */
    .login-card {
        background: #ffffff !important;
        padding: 40px 35px !important;
        border-radius: 16px !important;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04) !important;
        border: 1px solid #cbd5e1 !important;
        max-width: 480px !important; /* Largeur idéale pour un écran de connexion */
        width: 100% !important;
        box-sizing: border-box !important;
        margin: 0 auto !important;
        text-align: left !important;
    }

    .login-card h2 {
        color: #2e0854 !important; /* Violet historique de YaTout */
        font-size: 1.7rem !important;
        margin-top: 0 !important;
        margin-bottom: 25px !important;
        font-weight: 800 !important;
        text-align: center !important;
        letter-spacing: -0.5px !important;
    }

    /* 🟢 HABILLAGE DES CHAMPS GENERES PAR DJANGO (form.as_p) */
    .login-card form p {
        margin-bottom: 18px !important;
        display: flex !important;
        flex-direction: column !important;
        gap: 6px !important;
        width: 100% !important;
        max-width: 100% !important;
        box-sizing: border-box !important;
    }

    .login-card form label {
        color: #334155 !important;
        font-weight: 600 !important;
        font-size: 0.85rem !important;
    }

    /* 🟢 FORÇAGE DE LA LARGEUR ET DU DESIGN DES INPUTS */
    .login-card form input,
    .login-card form input[type="text"],
    .login-card form input[type="password"],
    .login-card form input[type="email"] {
        width: 100% !important;
        max-width: 100% !important;
        padding: 10px 14px !important;
        border: 1px solid #cbd5e1 !important;
        border-radius: 8px !important;
        font-size: 0.95rem !important;
        color: #0f172a !important;
        background-color: #ffffff !important;
        outline: none !important;
        box-sizing: border-box !important;
        transition: all 0.2s ease !important;
        height: auto !important;
    }

    /* Effet d'illumination mauve au focus */
    .login-card form input:focus {
        border-color: #7b24cc !important;
        box-shadow: 0 0 0 3px rgba(123, 36, 204, 0.1) !important;
    }

    /* Affichage des erreurs de connexion (Identifiants invalides, etc.) */
    .login-card .errorlist {
        background: #fef2f2 !important;
        color: #991b1b !important;
        border: 1px solid #fca5a5 !important;
        padding: 10px 15px !important;
        border-radius: 6px !important;
        font-size: 13px !important;
        list-style: none !important;
        margin: 0 0 20px 0 !important;
    }

    /* 🔑 BOUTON SE CONNECTER VIOLET PREMIUM */
    .btn-submit-login {
        display: block !important;
        width: 100% !important;
        background-color: #7b24cc !important;
        color: white !important;
        border: none !important;
        padding: 14px !important;
        border-radius: 8px !important;
        font-size: 0.95rem !important;
        font-weight: 600 !important;
        cursor: pointer !important;
        transition: all 0.2s ease !important;
        margin-top: 25px !important;
        box-shadow: 0 4px 12px rgba(123, 36, 204, 0.15) !important;
    }

    .btn-submit-login:hover {
        background-color: #2e0854 !important;
        box-shadow: 0 4px 15px rgba(46, 8, 84, 0.2) !important;
    }

    .btn-submit-login:active {
        transform: scale(0.99) !important;
    }

    /* 🔗 LIEN BAS DE PAGE */
    .login-footer {
        text-align: center !important;
        margin-top: 20px !important;
        font-size: 0.9rem !important;
        color: #64748b !important;
    }

    .login-footer a {
        color: #7b24cc !important;
        text-decoration: none !important;
        font-weight: 600 !important;
    }

    .login-footer a:hover {
        text-decoration: underline !important;
        color: #2e0854 !important;
    }
</style>

<div class="login-wrapper">
    <div class="login-card">
        <h2>Espace Vendeur</h2>
        
        <form method="POST">
            {% csrf_token %}
            
            <!-- Affiche proprement les champs de connexion -->
            {{ form.as_p }}
            
            <button type="submit" class="btn-submit-login">🔑 Se connecter</button>
        </form>
        
        <div class="login-footer">
            Pas encore de compte ? <a href="{% url 'inscription_vendeur' %}">Devenir Vendeur</a>
        </div>
    </div>
</div>
{% endblock %}
