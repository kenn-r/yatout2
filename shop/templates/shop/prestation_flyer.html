{% extends 'shop/base.html' %}
{% load static %}

{% block content %}
<!-- Conteneur principal limité en largeur et centré -->
<div style="max-width: 1100px; margin: 40px auto; padding: 0 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    
    <!-- Structure Flexible : Force le côte-à-côte sur ordinateur -->
    <div style="display: flex; flex-wrap: wrap; gap: 30px; align-items: start;">
        
        <!-- 📸 BLOC GAUCHE : L'Image des Flyers (Largeur contrôlée) -->
        <div style="flex: 1; min-width: 320px; max-width: 500px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 24px; padding: 16px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);">
            {% if prestation.image %}
                <img src="{{ prestation.image.url }}" id="image-prestation" style="border-radius: 16px; width: 100%; height: auto; display: block; object-fit: contain;" alt="{{ prestation.titre }}">
            {% else %}
                <div style="background: #f8fafc; height: 350px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 5rem;">📦</div>
            {% endif %}
        </div>

        <!-- 📝 BLOC DROIT : Le Formulaire Commercial Stylisé -->
        <div style="flex: 1.2; min-width: 320px; background: #ffffff; border: 1px solid #f1f5f9; border-radius: 24px; padding: 32px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);">
            
            <h1 style="color: #1e1b4b; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.025em; margin-bottom: 6px;">
                🚀 {{ prestation.titre }}
            </h1>
            <p style="color: #64748b; font-size: 0.875rem; line-height: 1.5; margin-bottom: 24px;">
                {{ prestation.description }}
            </p>

            <form method="POST" action="">
                {% csrf_token %}

                <!-- Sélection du Format (Désormais affiché en dur et verrouillé) -->
<!-- Sélection du Format (Affiché en DUR verrouillé) -->
<div style="margin-bottom: 20px;">
    <label style="display: block; font-weight: 600; font-size: 0.85rem; color: #334155; margin-bottom: 8px;">
        Format du flyer :
    </label>
    
    <div style="width: 100%; border-radius: 12px; font-size: 0.95rem; padding: 14px 16px; border: 1.5px solid #cbd5e1; color: #1e1b4b; background-color: #f8fafc; font-weight: 700; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between;">
        <span id="label-format-fixe">📐 Chargement...</span>
        <span style="color: #00a896; font-size: 0.8rem; font-weight: 600;">🔒 Sélectionné</span>
    </div>

    <!-- Sélecteur masqué -->
    <select name="format_choisi" id="format_choisi" style="display: none;" required>
        {% for format in formats_flyer %}
            <option value="{{ format.id }}" data-img="{% if format.image %}{{ format.image.url }}{% endif %}">
                {{ format.nom_format }}
            </option>
        {% endfor %}
    </select>
</div>
<!-- Sélection du volume (Lots et Tarifs) -->
                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-weight: 600; font-size: 0.85rem; color: #334155; margin-bottom: 8px;">
                        Lots et tarifs (FCFA) :
                    </label>
                    <select name="quantite_lot" id="quantite_lot" style="width: 100%; border-radius: 12px; font-size: 0.95rem; padding: 14px 16px; border: 1.5px solid #cbd5e1; color: #0f172a; background-color: #ffffff; box-sizing: border-box;" required>
                        <option value="" disabled selected>-- Choisir la quantité (Exemplaires) --</option>
                    </select>
                </div>

                <!-- 🟢 UN UNIQUE BLOC NUMÉRIQUE NETTOYÉ (SANS VALUE EN DUR) -->
                <div id="wrapper-custom-flyer" style="display: none; margin-bottom: 24px;">
                    <label style="display: block; font-weight: 600; font-size: 0.85rem; color: #7c3aed; margin-bottom: 8px;">
                        Saisissez la quantité libre souhaitée :
                    </label>
                    <input type="number" min="1" name="quantite_custom" id="quantite_custom" placeholder="600" style="width: 100%; border-radius: 12px; font-size: 0.95rem; padding: 14px 16px; border: 1.5px solid #7c3aed; color: #0f172a; box-sizing: border-box; font-weight: bold;">
                </div>

                <!-- Gros Bouton d'action violet -->
                <button type="submit" id="btn-submit" style="display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 16px; background-color: #7c3aed; color: #ffffff; border: none; border-radius: 14px; font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.025em; cursor: pointer; box-shadow: 0 4px 14px rgba(124, 58, 237, 0.3);" disabled>
                    🛒 Valider et voir le prix final
                </button>
            </form>
<script>
// Fonction maîtresse pour injecter l'affichage en dur, l'image et reconstruire les paliers de prix
function appliquerChangementFormat(selectElement) {
    const formatId = selectElement.value;
    const qteSelect = document.getElementById('quantite_lot');
    if (!formatId) return;
    
    // Met à jour le texte affiché en dur à l'utilisateur
    const optionSelectionnee = selectElement.options[selectElement.selectedIndex];
    const texteFormat = optionSelectionnee.text;
    const labelFixe = document.getElementById('label-format-fixe');
    if (labelFixe) {
        labelFixe.innerHTML = "📐 " + texteFormat.trim();
    }
    
    // 1. Mise à jour dynamique de l'image à gauche
    const urlImageFormat = optionSelectionnee.getAttribute('data-img');
    const grandeImage = document.getElementById('image-prestation');
    if (urlImageFormat && grandeImage) {
        grandeImage.src = urlImageFormat;
    }
    
    // 2. Reconstruction des options de quantités liées
    qteSelect.innerHTML = '<option value="" disabled selected>-- Choisir la quantité (Exemplaires) --</option>';
    
    {% for format in formats_flyer %}
        if (formatId == "{{ format.id }}") {
            {% for option in format.options_quantite.all %}
                qteSelect.innerHTML += '<option value="{{ option.quantite }}">Lot de {{ option.quantite }} ex. — {{ option.prix_total }} FCFA</option>';
            {% endfor %}
        }
    {% endfor %}
    
    qteSelect.innerHTML += '<option value="custom">Saisir une quantité libre (Sur-mesure)</option>';
    qteSelect.disabled = false;
}

// Écouteur d'événement au changement manuel du sélecteur masqué
document.getElementById('format_choisi').addEventListener('change', function() {
    appliquerChangementFormat(this);
});

// Gère le déploiement de la case numérique sur-mesure et l'activation du bouton de validation
document.getElementById('quantite_lot').addEventListener('change', function() {
    const customField = document.getElementById('wrapper-custom-flyer');
    const customInput = document.getElementById('quantite_custom');
    const btnSubmit = document.getElementById('btn-submit');
    
    if (this.value === 'custom') {
        customField.style.display = 'block';
        customInput.required = true;
        customInput.focus();
    } else {
        customField.style.display = 'none';
        customInput.required = false;
    }
    
    if (this.value) {
        btnSubmit.disabled = false;
    }
});

// Initialisation automatique et robuste au chargement de la page
document.addEventListener("DOMContentLoaded", function() {
    const selectFormat = document.getElementById('format_choisi');
    const qteSelect = document.getElementById('quantite_lot');
    
    const urlParams = new URLSearchParams(window.location.search);
    const formatIdDepuisUrl = urlParams.get('format_id');
    const actionDepuisUrl = urlParams.get('action'); 
    
    if (selectFormat && selectFormat.options.length > 0) {
        // 🟢 FIX CRUCIAL : Si format_id est présent dans l'URL on l'utilise, sinon on force l'index 1 (le premier vrai format après l'option vide)
        if (formatIdDepuisUrl) {
            selectFormat.value = formatIdDepuisUrl;
        } else {
            selectFormat.selectedIndex = 1; 
        }
        
        // On exécute immédiatement le rafraîchissement des données pour caler le format_id dans le formulaire
        appliquerChangementFormat(selectFormat);
        
        // Si l'utilisateur vient du gros bouton transparent "SUR-MESURE"
        if (actionDepuisUrl === "sur_mesure") {
            setTimeout(function() {
                if (qteSelect) {
                    qteSelect.value = "custom";
                    qteSelect.dispatchEvent(new Event('change'));
                }
            }, 150);
        }
    }
});
</script>
{% endblock %}
