{% extends 'shop/base.html' %}

{% block title %}YaTout — Devenir Vendeur{% endblock %}

{% block content %}
<!-- Style de secours intégré directement pour la page inscription -->
<style>
    /* 🟢 RE-CALIBRAGE GLOBAL DE L'ARRIVÉE SUR LA PAGE */
    .register-wrapper {
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        min-height: 75vh !important;
        padding: 40px 20px !important;
        background-color: #f1f5f9 !important; /* Gris légèrement plus pro pour faire détacher la carte blanche */
        font-family: system-ui, -apple-system, sans-serif !important;
        width: 100% !important;
        box-sizing: border-box !important;
    }

    /* 🟢 CONTENEUR DE CARTE COMPACT (Évite l'étirement infini sur l'écran) */
    .register-card {
        background: #ffffff !important;
        padding: 40px 35px !important;
        border-radius: 16px !important;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04) !important;
        border: 1px solid #cbd5e1 !important;
        max-width: 520px !important; /* Force la boîte à rester compacte */
        width: 100% !important;
        box-sizing: border-box !important;
        margin: 0 auto !important;
    }

    .register-card h2 {
        color: #2e0854 !important; /* Violet historique de YaTout */
        font-size: 1.7rem !important;
        margin-top: 0 !important;
        margin-bottom: 8px !important;
        font-weight: 800 !important;
        text-align: center !important;
        letter-spacing: -0.5px !important;
    }

    .register-subtitle {
        color: #64748b !important;
        font-size: 0.9rem !important;
        line-height: 1.5 !important;
        margin-bottom: 30px !important;
        text-align: center !important;
    }

    /* 🟢 ALIGNEMENT VERTICAL PROPRE DES BLOCS GENERES PAR DJANGO (form.as_p) */
    .register-card form p {
        margin-bottom: 18px !important;
        display: flex !important;
        flex-direction: column !important;
        gap: 6px !important;
        width: 100% !important;
        max-width: 100% !important;
        box-sizing: border-box !important;
    }

    .register-card form label {
        color: #334155 !important;
        font-weight: 600 !important;
        font-size: 0.85rem !important;
        text-align: left !important;
    }

    /* 🟢 FORÇAGE DE LA LARGEUR DES CHAMPS AUTOMATIQUES DJANGO (Neutralise les bugs système) */
    .register-card form input, 
    .register-card form select, 
    .register-card form textarea,
    .register-card form input[type="text"],
    .register-card form input[type="email"],
    .register-card form input[type="password"] {
        width: 100% !important;
        max-width: 100% !important;
        padding: 10px 14px !important;
        border: 1px solid #cbd5e1 !important; /* Bordure plus fine et moderne */
        border-radius: 8px !important;
        font-size: 0.95rem !important;
        color: #0f172a !important;
        background-color: #ffffff !important;
        outline: none !important;
        box-sizing: border-box !important;
        transition: all 0.2s ease !important;
        height: auto !important; /* Évite les déformations système de taille */
    }

    /* Effet d'illumination mauve au focus sur les inputs */
    .register-card form input:focus,
    .register-card form select:focus,
    .register-card form textarea:focus {
        border-color: #7b24cc !important;
        box-shadow: 0 0 0 3px rgba(123, 36, 204, 0.1) !important;
    }

    /* 🟢 CORRECTION SPÉCIFIQUE LISTE DÉROULANTE (DEVISE) */
    .register-card form select {
        cursor: pointer !important;
        appearance: none !important; /* Enlève le style brut par défaut des navigateurs */
        -webkit-appearance: none !important;
        -moz-appearance: none !important;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://w3.org' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>") !important;
        background-repeat: no-repeat !important;
        background-position: right 12px center !important;
        background-size: 16px !important;
        padding-right: 40px !important;
    }

    /* Style si Django retourne des messages d'erreurs de validation */
    .register-card .errorlist {
        background: #fef2f2 !important;
        color: #991b1b !important;
        border: 1px solid #fca5a5 !important;
        padding: 10px 15px !important;
        border-radius: 6px !important;
        font-size: 13px !important;
        list-style: none !important;
        margin: 0 0 20px 0 !important;
    }

    /* Bouton d'envoi Mauve YaTout */
    .btn-submit-register {
        display: block !important;
        width: 100% !important;
        background-color: #7b24cc !important;
        color: white !important;
        border: none !important;
        padding: 14px !important;
        border-radius: 8px !important;
        font-size: 0.95rem !important;
        font-weight: 600 !important;
        cursor: pointer !important;
        transition: all 0.2s ease !important;
        margin-top: 25px !important;
        box-shadow: 0 4px 12px rgba(123, 36, 204, 0.15) !important;
    }

    .btn-submit-register:hover {
        background-color: #2e0854 !important;
        box-shadow: 0 4px 15px rgba(46, 8, 84, 0.2) !important;
    }

    .btn-submit-register:active {
        transform: scale(0.99) !important;
    }
</style>

<div class="register-wrapper">
    <div class="register-card">
        <h2>Rejoignez-nous</h2>
        <p class="register-subtitle">Créez votre espace vendeur en quelques clics et commencez à vendre sur YaTout.</p>
        
        <form method="POST">
            {% csrf_token %}
            
            <!-- Affichage propre du formulaire généré par Django -->
            {{ form.as_p }}
            
            <button type="submit" class="btn-submit-register">🔮 Créer ma boutique</button>
        </form>
    </div>
</div>
{% endblock %}
